versioning:
  scheme: date-pinned
  current: '2026-04-25'
  mechanism: >-
    An optional `Version` request header carrying a date string. When it is omitted, Medblocks
    uses the version pinned on the API key. Declared in the contract as
    components.parameters.Version and applied to every operation.
  webhook_versioning: >-
    Each webhook delivery envelope carries `api_version`, the version pinned at endpoint
    registration — so a receiver's payload shape is pinned independently of the caller's key.
  unsupported_version_behaviour: >-
    HTTP 400 with error.type invalid_request_error and error.code unsupported_api_version.
  docs: https://medblocks.com/docs/reference/versioning
  note: >-
    The mechanism is real and enforced in the contract, but the /docs/reference/versioning page
    is still a stub — it carries a "This page is being written as part of the docs restructure"
    callout and no upgrade policy, no supported-version list and no deprecation window. The
    same is true of /docs/reference/conventions.
deprecation:
