source: https://medblocks.com/docs/reference/errors
format: vendor-envelope
note: 'Medblocks does not use RFC 9457 application/problem+json. It publishes its own typed envelope,
  returned on every non-2xx response from the Medblocks Platform API, with a broad `type` category and
  a stable machine-readable `code` inside it. The docs are explicit that callers should branch on `code`,
  and that the same strings appear on the wire (snake_case under `error`) and on the SDK''s MedblocksError
  (camelCase properties). Every 4xx/5xx response in openapi/medblocks-platform-openapi.json references
  #/components/schemas/ErrorEnvelope, so the spec and the docs agree.'
envelope:
  media_type: application/json
  schema: '#/components/schemas/ErrorEnvelope'
  fields:
  - wire: error.type
    sdk: type
    type: string
    description: Broad category such as authentication_error, invalid_request_error, or ehr_error.
  - wire: error.code
    sdk: code
    type: string
    description: Stable machine-readable code. Branch on this.
  - wire: error.message
    sdk: message
    type: string
    description: Human-readable explanation for developers and logs.
  - wire: error.param
    sdk: param
    type: string|null
    description: Request field or parameter related to the error, when available.
  - wire: error.request_id
    sdk: requestId
    type: string
    description: Correlation id; echoes the X-Request-Id response header. Include it in support tickets.
  - wire: error.doc_url
    sdk: docUrl
    type: string
    description: Link to the API errors reference. Same URL for every code.
  - wire: HTTP status line
    sdk: statusCode
    type: number
    description: Read from the status line, not the JSON body.
  - wire: Retry-After header
    sdk: retryAfter
    type: number|null
    description: Seconds to wait; set on rate_limit_error, null otherwise.
  example:
    error:
      type: authentication_error
      code: invalid_api_key
      message: API key invalid
      param: null
      doc_url: https://medblocks.com/docs/reference/errors
      request_id: 9c9b6f7a-8e4f-4a3b-9c1e-6f3a2d8b7c4d
