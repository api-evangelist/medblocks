retry_policy:
  sdk_retries: The medblocks SDK retries 429, 502, 503, 504 and network-level failures up to maxNetworkRetries
    (default 3) before throwing. It does not retry other 4xx or 500.
  retry_after: On a 429 the SDK honors the server Retry-After during its own retries; the final MedblocksError
    still carries retryAfter for caller-side backoff.
client_side_errors:
- name: MedblocksSignatureError
  raised_by: Medblocks.webhooks.constructEvent
  note: Thrown entirely client-side while verifying a webhook delivery. No HTTP status, no envelope, no
    doc_url. Read err.reason. Return 400 to the sender on any of them.
  docs: https://medblocks.com/docs/webhooks/signatures
