    - name: System
      description: Health and platform availability endpoints.
    - name: Patients
      description: Create, update, retrieve, and delete patients.
    - name: Connections
      description: Inspect configured EHR/FHIR source connections.
    - name: Patient sessions
      description: Create and inspect patient sessions.
    - name: Webhooks
      description: Register, rotate, and inspect webhook endpoints and deliveries.
    externalDocs:
      description: Medblocks Platform documentation
      url: https://medblocks.com/docs
