overlay: 1.0.0
info:
  title: API Evangelist enhancements for the Medblocks Platform API
  version: 1.0.0
x-provenance:
  generated: '2026-09-02'
  method: generated
  source: openapi/medblocks-platform-openapi.json
  note: >-
    Non-destructive Overlay over the provider's own OpenAPI 3.1.1 document. The upstream
    document declares no tags at all — every one of its 22 operations is untagged — and
    carries no info.contact, no externalDocs and no per-operation documentation links, even
    though the docs site groups the same operations into System, Patients, Connections,
    Patient sessions and Webhooks. This overlay adds those groupings and links from the
    provider's own published documentation. It does not alter any path, schema, parameter or
    response. Original saved verbatim; never mutated.
actions:
- target: $.info
  description: Add the contact and licence links the provider publishes on its own site.
  update:
