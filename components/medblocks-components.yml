source: >-
  https://medblocks.com/medblocks-ui-docs, https://github.com/medblocks/medblocks-ui,
  https://www.npmjs.com/package/medblocks-ui
note: >-
  medblocks-ui is a first-party open-source (Apache-2.0) library of standards-native Web
  Components for building clinical data-entry interfaces. It renders openEHR web templates and
  FHIR Questionnaires into forms and emits openEHR compositions or FHIR resources, and because
  the elements are custom elements they work in any framework or in a server-rendered template.
  It is a UI component library, not a client for the Medblocks Platform API — it predates the
  Platform API and is listed separately from packages/medblocks-packages.yml's SDK entry for
  that reason. Individual element names are taken from the provider's own documentation index;
  each element has its own docs page under /medblocks-ui-docs/.
