hosted_surfaces:
- name: Medblocks-hosted Patient Access page
  kind: hosted redirect flow
  docs: https://medblocks.com/docs/patient-access/create-patient-session/medblocks-hosted-page
  note: >-
    Not an embeddable component. The app supplies a patient id and return URL, then redirects
    the patient to the session URL Medblocks returns; source discovery and authorization UI are
    handled by Medblocks.
- name: MCP in-chat facility panel
  kind: in-chat panel rendered by the MCP server
  docs: https://medblocks.com/docs/mcp
  note: >-
    Rendered inside ChatGPT and claude.ai by the choose_health_systems tool. Not available in
    terminal clients (Claude Code, Codex), which fall back to a conversational list and a link.
