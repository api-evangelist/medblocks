divergence_summary: >-
  The MCP server is a conversational projection of the patient-connection and record-read
  half of the platform. The entire webhook subsystem (7 operations), EHR launch contexts,
  and patient mutation beyond create are REST-only — an agent operating through MCP alone
  cannot subscribe to records.sync.completed or manage a delivery endpoint. In the other
  direction, workspace selection and the in-chat facility picker exist only in MCP.
