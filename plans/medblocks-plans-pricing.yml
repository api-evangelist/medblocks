note: >-
  Medblocks publishes its plans on the docs billing page rather than on a marketing /pricing
  route (https://medblocks.com/pricing returns 404). Both tiers and both prices are stated
  openly, including the enterprise number — unusual for this category — and upgrades go
  through support@medblocks.com rather than self-serve checkout. The homepage carries an
  older, different framing (free up to 5 patients, $20/active patient/year pay-as-you-go,
  $60,000/year Complete); the docs billing page is the more specific and more recent of the
  two and is what is recorded here. The discrepancy on the free-tier patient allowance
  (5 vs 1,000) is a real inconsistency in the provider's own published material, not an
  ambiguity introduced here.
