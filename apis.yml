apis:
- aid: medblocks-platform-api
  name: Medblocks Platform API
  description: >-
    Server-to-server developer API for the Medblocks Platform. Create patients, start hosted
    PatientSessions that authorize a patient against one or more EHRs, inspect the resulting
    connections, read unified FHIR records with cursor pagination, and register/rotate/inspect
    webhook endpoints and deliveries. Bearer-authenticated with a workspace API key
    (mb_sk_live_ / mb_sk_sbx_), date-pinned via an optional Version header, and every non-2xx
    response carries a typed error envelope.
  humanURL: https://medblocks.com/docs/reference/api
  baseURL: https://app.medblocks.com
  tags:
  - FHIR
  - Patient Access
  - Webhooks
  - Health Data
  properties:
  - type: OpenAPI
    url: openapi/medblocks-platform-openapi.json
  - type: Overlay
    url: overlays/medblocks-platform-overlay.yaml
  - type: Documentation
    url: https://medblocks.com/docs
  - type: APIReference
    url: https://medblocks.com/docs/reference/api
- aid: medblocks-public-site-api
  name: Medblocks Public Site API
  description: >-
    A narrow, unauthenticated, read-only API that medblocks.com publishes for third-party and
    automated use: training-certificate verification plus the machine-readable blog RSS feed and
    sitemap index. Described by an OpenAPI 3.1 document served at the site root and advertised
    through the site's RFC 9727 /.well-known/api-catalog linkset.
  humanURL: https://medblocks.com/docs
  baseURL: https://medblocks.com
  tags:
  - Feeds
  - Certificates
  properties:
  - type: OpenAPI
    url: openapi/medblocks-public-site-openapi.json
  - type: Overlay
    url: overlays/medblocks-public-site-overlay.yaml
