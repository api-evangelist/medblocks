aid: medblocks
name: Medblocks
description: Medblocks is a health-data integration platform that gives applications a single API for
  a patient's longitudinal health record. Its Medblocks Platform API brokers patient-mediated connections
  to EHRs, payers and health information networks (Epic, Cerner/Oracle Health, athenahealth, eClinicalWorks,
  Meditech, CMS Blue Button, UnitedHealthcare and wearables), normalizes what comes back into FHIR R4,
  and delivers it through cursor-paginated record reads, signed webhooks, and export destinations such
  as a customer FHIR server or S3. It also ships clinician-workflow surfaces (SMART App Launch, CDS Hooks),
  backend/bulk services, a hosted Model Context Protocol server for AI assistants, a TypeScript SDK, and
  the open-source medblocks-ui web-component library and openFHIR openEHR-to-FHIR mapping engine. Founded
  by Sidharth Ramesh, Medblocks also runs FHIR and openEHR training bootcamps.
